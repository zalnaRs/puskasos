# yaml-language-server: $schema=https://schema.blue-build.org/module-list-v1.json

modules:
  - type: dnf
    repos:
      copr:
        - imput/helium
        # chroot: centos-stream-10-x86_64
    install:
      packages:
        - helium-bin

  # - type: containerfile
  #   snippets:
  #     - RUN xdg-settings set default-web-browser helium.desktop
  #     - RUN xdg-mime default helium.desktop x-scheme-handler/http
  #     - RUN xdg-mime default helium.desktop x-scheme-handler/https
  #     - RUN xdg-mime default helium.desktop text/html

  - type: systemd
    system:
      disabled:
        - dnf5daemon-server.service # gnome software integration

  - type: dnf
    group-install:
      with-optional: true
      packages:
        - virtualization

  - type: default-flatpaks
    configurations:
      #- notify: false # Send notification after install/uninstall is finished (true/false)
      #scope: system
      #install:
      #  - org.freedesktop.Platform.ffmpeg-full
      - scope: user # Also add Flathub user repo, but no user packages
